name: Android app check

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-ci.yml"
      - "youthzip-android/**"
      - "pages-youth-policy/scripts/generate-pages.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: youthzip-android/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Generate app policy data
        run: node pages-youth-policy/scripts/generate-pages.mjs

      - name: Install dependencies
        working-directory: youthzip-android
        run: npm ci

      - name: Build and sync web assets
        working-directory: youthzip-android
        run: |
          npm run build
          npx cap sync android

      - name: Build debug APK
        working-directory: youthzip-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: youthzip-debug-apk
          path: youthzip-android/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
